name: Compilar APK Mi Agenda Gestión

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: APK Android 15 / TECNO MegaPad Pro 12
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Reconstruir código y datos de forma segura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/pe/agenda/gestion app/src/main/assets
          base64 -d build-support/MainActivity.java.gz.b64 | gzip -dc > app/src/main/java/pe/agenda/gestion/MainActivity.java
          base64 -d build-support/DB.java.gz.b64 | gzip -dc > app/src/main/java/pe/agenda/gestion/DB.java
          base64 -d build-support/seed_events.json.gz.b64 | gzip -dc > app/src/main/assets/seed_events.json
          test -s app/src/main/java/pe/agenda/gestion/MainActivity.java
          test -s app/src/main/java/pe/agenda/gestion/DB.java
          test -s app/src/main/assets/seed_events.json
          python3 -m json.tool app/src/main/assets/seed_events.json >/dev/null
          echo "Archivos reconstruidos correctamente"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35 y Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK instalable de prueba
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Preparar APK con nombre simple
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/MiAgendaGestion-TecnoMegaPadPro12.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: MiAgendaGestion-TecnoMegaPadPro12
          path: dist/MiAgendaGestion-TecnoMegaPadPro12.apk
          if-no-files-found: error
          retention-days: 30
