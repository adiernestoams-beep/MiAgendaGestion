name: Compilar APK 365 Agenda

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    name: 365 Agenda / TECNO MegaPad Pro 12
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Reconstruir código, datos y logo oficial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/pe/agenda/gestion app/src/main/assets app/src/main/res/drawable-nodpi
          base64 -d build-support/MainActivity.java.gz.b64 | gzip -dc > app/src/main/java/pe/agenda/gestion/MainActivity.java
          base64 -d build-support/DB.java.gz.b64 | gzip -dc > app/src/main/java/pe/agenda/gestion/DB.java
          base64 -d build-support/seed_events.json.gz.b64 | gzip -dc > app/src/main/assets/seed_events.json
          { cat build-support/adb_00.b64 build-support/adb_01.b64 build-support/adb_02.b64 build-support/adb_03a.b64 build-support/adb_03b_nopad.b64; printf '='; } | tr -d '\r\n ' | base64 -d | gzip -dc > app/src/main/java/pe/agenda/gestion/AgendaDb3.java
          tr -d '\r\n ' < build-support/FinalActivity.java.gz.b64 | base64 -d | gzip -dc > app/src/main/java/pe/agenda/gestion/FinalActivity.java
          sed -i '/db.ensureOfficialOctober2026();/a\        DriveLinks.apply(db);' app/src/main/java/pe/agenda/gestion/FinalActivity.java
          tr -d '\r\n ' < build-support/SplashActivity.java.gz.b64 | base64 -d | gzip -dc > app/src/main/java/pe/agenda/gestion/SplashActivity.java

          # Logo oficial indicado por el usuario. Si no se obtiene exactamente este archivo, la compilación falla.
          rm -f app/src/main/res/drawable-nodpi/logo_365.png
          curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 20 \
            "https://drive.usercontent.google.com/download?id=1bBxP2k3k1kiFMqcJsJutdv2w-AcLnScU&export=download&confirm=t" \
            -o app/src/main/res/drawable-nodpi/logo_365.png
          echo "626c6de4acba04e3482e59d592ccf0c55e3bc593a6d691e8780c9c9c9227fb14  app/src/main/res/drawable-nodpi/logo_365.png" | sha256sum -c -

          test -s app/src/main/java/pe/agenda/gestion/DriveLinks.java
          test -s app/src/main/java/pe/agenda/gestion/FinalActivity.java
          test -s app/src/main/assets/seed_events.json
          test -s app/src/main/res/drawable-nodpi/logo_365.png
          test -s app/src/main/res/drawable/ic_launcher_foreground.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          grep -q 'DriveLinks.apply(db)' app/src/main/java/pe/agenda/gestion/FinalActivity.java
          grep -q '@drawable/logo_365' app/src/main/res/drawable/ic_launcher_foreground.xml
          grep -q '@mipmap/ic_launcher' app/src/main/AndroidManifest.xml
          grep -q '@mipmap/ic_launcher_round' app/src/main/AndroidManifest.xml
          python3 -m json.tool app/src/main/assets/seed_events.json >/dev/null
          file app/src/main/res/drawable-nodpi/logo_365.png | grep -qi 'PNG image data'
          echo "365 Agenda v5: logo oficial verificado e identidad visual aplicada"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Preparar Android SDK preinstalado
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME}" -type f -name sdkmanager -print -quit)"
          if [ -z "$SDKMANAGER" ]; then
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Instalar Android SDK 35 y Build Tools
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK 365 Agenda
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Preparar APK final
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/365Agenda-TecnoMegaPadPro12-v5.apk"
          sha256sum "dist/365Agenda-TecnoMegaPadPro12-v5.apk"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: 365Agenda-TecnoMegaPadPro12-v5
          path: dist/365Agenda-TecnoMegaPadPro12-v5.apk
          if-no-files-found: error
          retention-days: 30
